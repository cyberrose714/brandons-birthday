
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandon</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* INTRO */

#intro {
  background: radial-gradient(
    circle,
    #280000 0%,
    #080000 40%,
    #050505 75%
  );
}

.ember {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #d00000;
  box-shadow:
    0 0 15px #ff0000,
    0 0 40px #a00000,
    0 0 80px #600000;
  animation: pulse 2s infinite;
  margin-bottom: 35px;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: .6;
  }
  50% {
    transform: scale(1.8);
    opacity: 1;
  }
}

.intro-text {
  font-size: 16px;
  letter-spacing: 4px;
  line-height: 1.8;
  color: #bbb;
  max-width: 700px;
}

/* BIRTHDAY */

#birthday {
  background: radial-gradient(
    circle,
    #190000 0%,
    #050505 70%
  );
}

#birthdayText {
  font-size: clamp(32px, 7vw, 80px);
  letter-spacing: 5px;
  max-width: 1000px;
  text-shadow:
    0 0 15px rgba(255,0,0,.4),
    0 0 40px rgba(255,0,0,.2);
}

.cursor {
  border-right: 3px solid #a00000;
  padding-right: 5px;
  animation: blink .7s infinite;
}

@keyframes blink {
  50% {
    border-color: transparent;
  }
}

#continueButton {
  margin-top: 45px;
  padding: 13px 30px;
  background: transparent;
  color: white;
  border: 1px solid #740000;
  border-radius: 4px;
  letter-spacing: 3px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 1s ease,
    background .3s ease,
    box-shadow .3s ease;
}

#continueButton.show {
  opacity: 1;
  pointer-events: auto;
}

#continueButton:hover {
  background: #4d0000;
  box-shadow: 0 0 20px rgba(170,0,0,.5);
}

/* GIFT */

#giftScreen {
  background: radial-gradient(
    circle,
    #170000 0%,
    #050505 70%
  );
}

.gift-title {
  margin-bottom: 70px;
  font-size: 14px;
  letter-spacing: 5px;
  color: #aaa;
}

.gift-container {
  position: relative;
  width: 170px;
  height: 170px;
  cursor: pointer;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-12px);
  }
}

.gift-box {
  position: absolute;
  width: 150px;
  height: 120px;
  left: 10px;
  bottom: 0;
  background: linear-gradient(
    135deg,
    #4c0707,
    #250303
  );
  border: 2px solid #8d1111;
  box-shadow:
    0 20px 35px rgba(0,0,0,.6),
    0 0 25px rgba(130,0,0,.3);
}

.gift-box::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(
    to right,
    #111,
    #2b2b2b,
    #111
  );
}

.gift-lid {
  position: absolute;
  width: 170px;
  height: 38px;
  left: 0;
  top: 22px;
  background: linear-gradient(
    135deg,
    #750c0c,
    #3b0505
  );
  border: 2px solid #a41b1b;
  z-index: 5;
  transform-origin: left bottom;
  transition: transform 1s ease;
}

.gift-lid::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(
    to right,
    #111,
    #2b2b2b,
    #111
  );
}

.gift-glow {
  position: absolute;
  width: 90px;
  height: 90px;
  left: 40px;
  top: 45px;
  border-radius: 50%;
  background: rgba(210,0,0,.7);
  filter: blur(22px);
  opacity: 0;
  transition: opacity 1s ease;
}

.gift-container.open .gift-lid {
  transform: translateY(-65px) rotate(-18deg);
}

.gift-container.open .gift-glow {
  opacity: 1;
}

.gift-container.open .gift-box {
  animation: giftFlash 1.3s forwards;
}

@keyframes giftFlash {
  50% {
    box-shadow:
      0 0 45px rgba(210,0,0,.8),
      0 0 90px rgba(150,0,0,.5);
  }
  100% {
    box-shadow: 0 0 25px rgba(140,0,0,.4);
  }
}

.click-text {
  margin-top: 40px;
  font-size: 11px;
  letter-spacing: 4px;
  color: #777;
}

/* SPARKS */

.spark {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #ff3b1f;
  box-shadow:
    0 0 8px #ff1e00,
    0 0 15px #b60000;
  z-index: 20;
  pointer-events: none;
  animation: sparkFly 1.5s ease-out forwards;
}

@keyframes sparkFly {
  0% {
    transform: translate(0,0) scale(1);
    opacity: 1;
  }
  100% {
    transform:
      translate(var(--x),var(--y))
      scale(0);
    opacity: 0;
  }
}

/* MESSAGE */

#messageScreen {
  background: radial-gradient(
    circle,
    #130000 0%,
    #050505 70%
  );
  overflow-y: auto;
}

.message-name {
  margin-bottom: 30px;
  font-size: 35px;
  letter-spacing: 8px;
}

.message {
  max-width: 700px;
  font-size: 18px;
  line-height: 1.9;
  color: #ccc;
  min-height: 250px;
}

#typedMessage,
#typedGoodbye {
  white-space: pre-line;
}

#messageCursor,
#goodbyeCursor {
  color: #a00000;
  animation: cursorBlink .7s infinite;
}

@keyframes cursorBlink {
  0%, 50% {
    opacity: 1;
  }
  51%, 100% {
    opacity: 0;
  }
}

/* ENDING */

#endingScreen {
  background: radial-gradient(
    circle,
    #170000 0%,
    #050505 72%
  );
}

.ending-ember {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #d00000;
  box-shadow:
    0 0 15px #ff0000,
    0 0 40px #8a0000,
    0 0 75px #550000;
  margin-bottom: 45px;
  animation: endingPulse 2.5s infinite;
}

@keyframes endingPulse {
  0%, 100% {
    transform: scale(1);
    opacity: .5;
  }
  50% {
    transform: scale(1.6);
    opacity: 1;
  }
}

#endingText {
  font-size: clamp(26px,5vw,48px);
  line-height: 1.8;
  letter-spacing: 2px;
  max-width: 800px;
  color: #eee;
}

.heart {
  color: #a60000;
  text-shadow:
    0 0 10px rgba(255,0,0,.6),
    0 0 25px rgba(180,0,0,.4);
}

.fade-away {
  animation: fadeAway 4s forwards;
}

@keyframes fadeAway {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

/* MUSIC */

#musicIndicator {
  position: fixed;
  bottom: 20px;
  right: 25px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #777;
  opacity: 0;
  transition: opacity 1s ease;
  z-index: 100;
}

#musicIndicator.show {
  opacity: 1;
}

/* NEW GOODBYE SCREEN */

#goodbyeScreen {
  background: radial-gradient(
    circle,
    #130000 0%,
    #050505 70%
  );
  overflow-y: auto;
  justify-content: flex-start;
  padding-top: clamp(65px,10vh,105px);
  padding-bottom: 85px;
}
</style>
</head>

<body>

<audio id="birthdayMusic" preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="musicIndicator">♪ PLAYING</div>

<!-- INTRO -->

<section class="screen active" id="intro">
  <div class="ember"></div>
  <div class="intro-text">
    FOR SOMEONE WHO MEANS MORE THAN WORDS CAN EXPLAIN
  </div>
</section>

<!-- BIRTHDAY -->

<section class="screen" id="birthday">
  <h1 id="birthdayText" class="cursor"></h1>
  <button id="continueButton" onclick="showGift()">
    CONTINUE
  </button>
</section>

<!-- GIFT -->

<section class="screen" id="giftScreen">
  <div class="gift-title">
    I HAVE SOMETHING FOR YOU
  </div>
  <div class="gift-container" id="gift" onclick="openGift()">
    <div class="gift-glow"></div>
    <div class="gift-lid"></div>
    <div class="gift-box"></div>
  </div>
  <div class="click-text">CLICK THE GIFT</div>
</section>

<!-- ORIGINAL MESSAGE -->

<section class="screen" id="messageScreen">
  <div class="message-name">BRANDON</div>
  <div class="message">
    <span id="typedMessage"></span><span id="messageCursor">|</span>
  </div>
</section>

<!-- ORIGINAL ENDING -->

<section class="screen" id="endingScreen">
  <div class="ending-ember" id="endingEmber"></div>
  <div id="endingText"></div>
</section>

<!-- NEW GOODBYE -->

<section class="screen" id="goodbyeScreen">
  <div class="message-name">BRANDON</div>
  <div class="message">
    <span id="typedGoodbye"></span><span id="goodbyeCursor">|</span>
  </div>
</section>

<script>

const birthdayMessage = "HAPPY BIRTHDAY BRANDON!!!";

const personalMessage = `I hope this year brings you peace, happiness, growth, and everything you've been working toward.

There are so many things I could say to you, and somehow it still feels impossible to put everything into words.

No matter what we've been through, you'll always be someone who has meant a lot to me.

We've shared memories, laughs, arguments, good moments, bad moments, and everything in between.

And even through all of that, there are things about you and moments we've shared that I'll never forget.

I genuinely hope this next chapter of your life brings you everything you've been searching for.

I hope you grow into the person you want to be, accomplish the things you've been working toward, and find happiness in places you never expected.

You deserve moments that remind you how much your presence matters.

Remember that you are loved.`;


/* FINAL GOODBYE MESSAGE */

const goodbyeMessage = `I won’t pretend that everything between us was okay,…. Or that some of the things I experienced didn’t hurt me deeply. They did….. But I also don’t want to carry that hurt with me forever, and I don’t want those experiences to take away from the good I know I’m capable of giving.

I genuinely hope you take the time to reflect on the choices you’ve made, recognize the parts of yourself that still need healing, and work through them. Not for me, and not to change what’s already happened, but for yourself and the people who may come into your life.

Because the things we don’t address within ourselves often become the pain we unintentionally pass on to others, and nobody deserves that.

Despite everything, I still wish you happiness, growth, and peace. I hope you find those things within yourself.

Take care of yourself, Brandon. 🤍`;


/* SCREEN TRANSITIONS */

function changeScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}


/* BIRTHDAY TYPEWRITER */

function showBirthday() {
  changeScreen("birthday");

  const typed = document.getElementById("birthdayText");
  typed.textContent = "";

  let i = 0;

  const timer = setInterval(() => {
    typed.textContent += birthdayMessage.charAt(i);
    i++;

    if (i >= birthdayMessage.length) {
      clearInterval(timer);
      typed.classList.remove("cursor");

      setTimeout(() => {
        document.getElementById("continueButton").classList.add("show");
      }, 500);
    }
  }, 100);
}


/* MUSIC */

function startMusic() {
  const music = document.getElementById("birthdayMusic");

  music.volume = 0.7;
  music.currentTime = 0;

  music.play()
    .then(() => {
      document.getElementById("musicIndicator").classList.add("show");
    })
    .catch(error => {
      console.log("Music error:", error);
    });
}


/* GIFT */

function showGift() {
  startMusic();
  changeScreen("giftScreen");
}

function createSparks() {
  const gift = document.getElementById("gift");

  for (let i = 0; i < 40; i++) {
    const spark = document.createElement("div");
    spark.className = "spark";

    const x = (Math.random() - 0.5) * 350;
    const y = -80 - Math.random() * 260;

    spark.style.setProperty("--x", x + "px");
    spark.style.setProperty("--y", y + "px");
    spark.style.left = "82px";
    spark.style.top = "80px";

    const size = 3 + Math.random() * 5;
    spark.style.width = size + "px";
    spark.style.height = size + "px";
    spark.style.animationDuration =
      (1 + Math.random() * 1.3) + "s";

    gift.appendChild(spark);

    setTimeout(() => spark.remove(), 2500);
  }
}

function openGift() {
  const gift = document.getElementById("gift");

  if (gift.classList.contains("open")) return;

  gift.classList.add("open");

  setTimeout(createSparks, 250);

  setTimeout(() => {
    changeScreen("messageScreen");
    setTimeout(typePersonalMessage, 700);
  }, 2200);
}


/* ORIGINAL PERSONAL MESSAGE */

function typePersonalMessage() {
  const typed = document.getElementById("typedMessage");
  const cursor = document.getElementById("messageCursor");

  typed.textContent = "";
  cursor.style.display = "inline";

  let i = 0;

  const slowStart =
    personalMessage.indexOf("Remember that you are loved.");

  function nextLetter() {
    typed.textContent += personalMessage.charAt(i);
    i++;

    if (i >= personalMessage.length) {
      cursor.style.display = "none";
      setTimeout(showEnding, 3000);
      return;
    }

    let delay = i >= slowStart ? 110 : 38;
    if (i === slowStart) delay = 1200;

    setTimeout(nextLetter, delay);
  }

  nextLetter();
}


/* ORIGINAL ENDING */

function showEnding() {
  changeScreen("endingScreen");

  const typed = document.getElementById("endingText");
  const ember = document.getElementById("endingEmber");

  typed.innerHTML = "";
  typed.classList.remove("fade-away");
  ember.classList.remove("fade-away");

  const text =
    "Happy Birthday, Brandon.\n" +
    "I hope you have a beautiful year. ♥";

  let i = 0;

  function nextLetter() {
    const letter = text.charAt(i);
    i++;

    if (letter === "\n") {
      typed.appendChild(document.createElement("br"));
    } else if (letter === "♥") {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = "♥";
      typed.appendChild(heart);
    } else {
      typed.appendChild(document.createTextNode(letter));
    }

    if (i < text.length) {
      setTimeout(nextLetter, 85);
    } else {
      setTimeout(() => {
        typed.classList.add("fade-away");
        ember.classList.add("fade-away");

        setTimeout(showGoodbye, 4400);
      }, 4500);
    }
  }

  setTimeout(nextLetter, 800);
}


/* NEW GOODBYE WITH PAUSES */

function showGoodbye() {
  changeScreen("goodbyeScreen");

  const screen = document.getElementById("goodbyeScreen");
  const typed = document.getElementById("typedGoodbye");
  const cursor = document.getElementById("goodbyeCursor");

  typed.textContent = "";
  cursor.style.display = "inline";
  screen.scrollTop = 0;

  let i = 0;

  const pauses = [
    {
      text: "didn’t hurt me deeply.",
      delay: 1800
    },
    {
      text: "They did…..",
      delay: 2200
    }
  ];

  function nextLetter() {
    if (i >= goodbyeMessage.length) {
      cursor.style.display = "none";
      return;
    }

    const letter = goodbyeMessage.charAt(i);
    typed.textContent += letter;
    i++;

    screen.scrollTop = screen.scrollHeight;

    let delay = 38;

    if (
      letter === "." ||
      letter === "!" ||
      letter === "?"
    ) {
      delay = 140;
    }

    if (letter === "…") delay = 200;
    if (letter === "\n") delay = 350;

    const pause = pauses.find(p =>
      i === goodbyeMessage.indexOf(p.text) + p.text.length
    );

    if (pause) {
      delay = pause.delay;
    }

    setTimeout(nextLetter, delay);
  }

  setTimeout(nextLetter, 900);
}


/* START WEBSITE */

setTimeout(showBirthday, 3500);

</script>
</body>
</html>
